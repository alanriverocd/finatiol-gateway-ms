# ============================================================
# Perfil LOCAL — Spring Tools Eclipse (sin Docker)
# Rutas estáticas directas a localhost, sin dependencia de Eureka
# Activar con: -Dspring.profiles.active=local
# ============================================================

# Deshabilitar Eureka (no resuelve 'discovery-ms' fuera de Docker)
eureka.client.enabled=false
spring.cloud.gateway.discovery.locator.enabled=false

# Redis en local
spring.data.redis.host=localhost

# ---- Rutas estáticas ----------------------------------------
# La request llega como  /finatiol-XXX-ms/ruta
# StripPrefix=1 elimina el primer segmento antes de reenviar

spring.cloud.gateway.server.webmvc.routes[0].id=autenticacion
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/finatiol-autenticacion-ms/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

