spring.application.name=finatiol-gateway-ms

spring.config.import=optional:configserver:http://config-ms:8888

server.port=8080

eureka.client.service-url.defaultZone=http://discovery-ms:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# CORS global — permite requests desde Flutter Web (localhost:*) en desarrollo
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true

# Distributed Tracing - Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://finatiol-zipkin:9411/api/v2/spans

# Redis
spring.data.redis.host=finatiol-redis
spring.data.redis.port=6379

# Rate Limiting (por IP, ventana deslizante)
rate.limit.max-requests=20
rate.limit.window-seconds=60